<!doctype html><meta charset="utf-8"><title>采集回放检查</title>
<style>body{font-family:sans-serif;background:#202124;color:#eee;margin:20px}section{background:#303134;padding:16px;border-radius:8px;margin:14px 0}.views{display:grid;grid-template-columns:1fr 1fr;gap:14px}img{width:100%;background:#111;min-height:100px}button{padding:10px 16px;background:#426c9a;color:white;border:0;border-radius:5px;font-size:16px;cursor:pointer}input{width:100%}pre{white-space:pre-wrap;font-size:14px;color:#bcd}a{color:#a3c9ff}#status{color:#ffc98b}.blank{opacity:.3}h2{font-size:17px}@media(max-width:900px){.views{grid-template-columns:1fr}}</style>
<h1>采集回放检查</h1><a href="/">返回实时采集页面</a><p id="heading">载入中…</p>
<section><button id="play" onclick="togglePlay()">播放</button><span id="time"></span><input id="slider" type="range" min="0" value="0" oninput="pause();show(Number(this.value))"><p id="status"></p><pre id="angles"></pre></section>
<div class="views"><section><h2>腕部相机</h2><img id="hand"></section><section><h2>上方相机</h2><img id="top"></section><section><h2>原始深度的0–2米热图预览</h2><img id="depth"></section></div>
<section><h2>本集质量报告</h2><pre id="quality"></pre><p>标记成功不等于数据质量合格。先检查动作、相机遮挡、同步误差，再挑选训练片段；原始深度完整保留。</p></section>
<script>
let samples=[],events=[],index=0,playing=false,timer=null;const query=new URLSearchParams(location.search);const episode=query.get('episode');const datasetQuery=query.has('dataset')?'&dataset='+encodeURIComponent(query.get('dataset')):'';
function pause(){playing=false;clearTimeout(timer);document.getElementById('play').textContent='播放';}
function show(i){if(!samples.length)return;index=Math.min(Math.max(i,0),samples.length-1);const s=samples[index];document.getElementById('slider').value=index;const elapsed=(s.read_window_ns[1]-samples[0].read_window_ns[1])/1e9;document.getElementById('time').textContent=' '+elapsed.toFixed(2)+' 秒 · 样本 '+(index+1)+'/'+samples.length;const notes=[];for(const name of ['hand','top','depth']){const f=s.images[name];const img=document.getElementById(name);if(f.file){img.src='/recorded?episode='+encodeURIComponent(episode)+datasetQuery+'&file='+encodeURIComponent(f.file);img.className=f.fresh?'':'blank';}else{img.removeAttribute('src');img.alt='本样本之前没有可匹配的图像';}if(!f.fresh)notes.push(name+'缺失或过旧');if(f.reused)notes.push(name+'复用了上一图像');}if(!s.demonstration_segment)notes.push('该段未跟随或处于暂停，不应直接作示范');const phase=events.filter(e=>e.type==='phase'&&e.mono_ns<=s.read_window_ns[1]).at(-1);document.getElementById('status').textContent=(phase?'阶段：'+phase.phase+'。 ':'')+notes.join('；');const fmt=v=>v.map(x=>x.toFixed(2)).join('  ');document.getElementById('angles').textContent='J1–J7（度）\n主臂：'+fmt(s.leader_deg)+'\n从臂：'+fmt(s.state_deg)+'\n指令：'+fmt(s.action_position_reference_deg);}
function next(){if(!playing)return;if(index>=samples.length-1){pause();return;}const delta=(samples[index+1].read_window_ns[1]-samples[index].read_window_ns[1])/1e6;timer=setTimeout(()=>{show(index+1);next();},Math.min(5000,Math.max(10,delta)));}
function togglePlay(){if(playing){pause();return;}if(index===samples.length-1)show(0);playing=true;document.getElementById('play').textContent='暂停回放';next();}
async function init(){try{const r=await fetch('/api/episode?episode='+encodeURIComponent(episode)+datasetQuery);const x=await r.json();if(!r.ok)throw Error(x.error);samples=x.samples;events=x.events;document.getElementById('slider').max=Math.max(0,samples.length-1);document.getElementById('heading').textContent=episode+' · '+x.metadata.task+' · '+x.metadata.outcome+' · '+(x.metadata.reason||'');document.getElementById('quality').textContent=JSON.stringify(x.metadata.quality,null,2);if(!samples.length)document.getElementById('status').textContent='没有收到控制样本，请检查遥操作遥测，不能作为训练示范。';show(0);}catch(e){document.getElementById('heading').textContent='回放失败：'+e.message;}}
init();
</script>
